{% extends "base.html" %}
{% import "macros.html" as m %}

{% block sidebar %}
<div class="nav-section-label">Chart</div>
<button class="nav-item ok active">
  <span class="nav-dot"></span>{{ title | default('Chart') }}
</button>
{% endblock %}

{% block content %}
<div style="margin-bottom: 16px;">
  <h1 style="font-size: 24px; font-weight: 700; color: var(--text); margin: 0 0 8px;">{{ title }}</h1>
</div>
<div class="chart-box"><canvas id="chart-main"></canvas></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
  var chartConfig = {{ chart_config_json | safe }};
  var tooltipLabels = {{ tooltip_labels_json | safe }};

  // [v1.2.8] If candlestick (rendered as floating bar), override tooltip
  // to show OHLC values instead of [low, high] array.
  if (tooltipLabels) {
    if (!chartConfig.options.plugins.tooltip) {
      chartConfig.options.plugins.tooltip = {};
    }
    chartConfig.options.plugins.tooltip.callbacks = {
      label: function(context) {
        var idx = context.dataIndex;
        if (tooltipLabels && tooltipLabels[idx]) {
          return tooltipLabels[idx];
        }
        return '';
      }
    };
  }

  var ctx = document.getElementById('chart-main').getContext('2d');
  try {
    new Chart(ctx, chartConfig);
  } catch(e) {
    console.error('Chart render error:', e);
    document.getElementById('chart-main').parentElement.innerHTML =
      '<div style="color:#ef4444;padding:20px;">Chart error: ' + e.message + '</div>';
  }
</script>
{% endblock %}

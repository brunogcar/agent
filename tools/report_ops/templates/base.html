<!DOCTYPE html>
<html lang="en" data-theme="{{ theme | default('dark') }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title | default('Report') }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/Chart.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    :root[data-theme="dark"] {
      --bg: #0a0c10; --bg-sec: #111318; --bg-card: #111318; --text: #d0d5e0; --text-sec: #6b7280;
      --border: #252b38; --brand: #00e5a0; --brand-dim: rgba(0,229,160,0.08); --info: #3b82f6; --accent: {{ accent | default('#00e5a0') }};
      --shadow: 0 4px 12px rgba(0,0,0,0.3); --hover-bg: #181c24;
      --table-stripe: rgba(255,255,255,0.01); --table-hover: rgba(0,229,160,0.04);
      --code-bg: #0f172a; --mermaid-bg: #111318;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc; --bg-sec: #ffffff; --bg-card: #ffffff; --text: #1e293b; --text-sec: #64748b;
      --border: #e2e8f0; --brand: #0d9488; --brand-dim: rgba(13,148,136,0.08); --info: #3b82f6; --accent: {{ accent | default('#0d9488') }};
      --shadow: 0 1px 3px rgba(0,0,0,0.05); --hover-bg: #f1f5f9;
      --table-stripe: rgba(148,163,184,0.04); --table-hover: rgba(13,148,136,0.04);
      --code-bg: #1e293b; --mermaid-bg: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5; overflow: hidden;
    }

    /* ── Layout (grid-based for proper centering) ── */
    .app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
    .sidebar {
      background: var(--bg-sec); border-right: 1px solid var(--border);
      padding: 24px 0; overflow-y: auto; height: 100vh; position: fixed; width: 260px; z-index: 10;
    }
    .main {
      grid-column: 2; overflow-y: auto; padding: 32px 40px; height: 100vh;
    }
    .main-inner { max-width: 1200px; margin: 0 auto; }

    /* ── Sidebar brand header ── */
    .sidebar-brand { padding: 0 20px 16px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
    .sidebar-brand-tag { font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--brand); margin-bottom: 4px; }
    .sidebar-brand-title { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.3; }

    /* ── Top bar ── */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 28px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
    }
    .top-bar h1 { font-size: 22px; font-weight: 700; color: var(--text); margin: 0; }
    .top-bar-actions { display: flex; gap: 8px; align-items: center; }
    .btn-icon {
      width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-sec); color: var(--text-sec); cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 15px;
      transition: all 0.2s;
    }
    .btn-icon:hover { background: var(--hover-bg); color: var(--brand); border-color: var(--brand); }

    /* ── Nav items ── */
    .nav-section-label {
      font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--text-sec); padding: 10px 16px 2px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 8px; padding: 6px 14px;
      margin: 0 8px; border-radius: 6px; font-size: 12px; color: var(--text-sec);
      cursor: pointer; transition: all 0.15s; border: none; background: none;
      width: calc(100% - 16px); text-align: left; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .nav-item:hover { background: var(--hover-bg); color: var(--text); }
    .nav-item.active { background: var(--brand-dim); color: var(--brand); font-weight: 600; }
    .nav-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-sec); flex-shrink: 0; }
    .nav-item.ok .nav-dot { background: #22c55e; }
    .nav-item.warn .nav-dot { background: #f59e0b; }
    .nav-item.err .nav-dot { background: #ef4444; }

    /* ── Content elements ── */
    .subtitle { color: var(--text-sec); font-size: 14px; margin-bottom: 24px; }
    h2 { font-size: 18px; font-weight: 600; margin: 0 0 16px; color: var(--text); }
    .section-title {
      font-size: 16px; font-weight: 700; color: var(--text); margin: 28px 0 12px;
      padding-bottom: 6px; border-bottom: 2px solid var(--brand); display: inline-block;
    }
    .section { margin-bottom: 36px; }
    .text-block { line-height: 1.7; color: var(--text-sec); }

    /* ── KPI grid ── */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px 16px; text-align: center; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .kpi-card:hover { border-color: var(--brand); box-shadow: var(--shadow); }
    .kpi-value { font-size: 30px; font-weight: 700; color: var(--brand); line-height: 1.15; }
    .kpi-label { font-size: 11px; color: var(--text-sec); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
    .kpi-delta { font-size: 13px; font-weight: 600; margin-top: 8px; }
    .kpi-delta.pos { color: #22c55e; }
    .kpi-delta.neg { color: #ef4444; }
    .kpi-delta.neu { color: var(--text-sec); }

    /* ── Cards ── */
    .card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px; margin-bottom: 16px; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover { border-color: var(--brand); box-shadow: var(--shadow); }
    .card-title {
      font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px; color: var(--brand); margin-bottom: 12px;
    }

    /* ── Data tables ── */
    .data-table { width: auto; min-width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table th {
      font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--text-sec); text-align: left;
      padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--bg-sec);
    }
    .data-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: top; }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tbody tr:nth-child(odd) { background: var(--table-stripe); }
    .data-table tbody tr:hover { background: var(--table-hover); }
    .metric-row td:first-child { color: var(--text-sec); font-weight: 600; }
    .metric-row td:last-child { text-align: right; font-family: ui-monospace, monospace; font-weight: 600; color: var(--text); }

    /* ── Badges ── */
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge.cheap { background: rgba(34,197,94,0.18); color: #22c55e; }
    .badge.fair { background: rgba(245,158,11,0.18); color: #f59e0b; }
    .badge.expensive { background: rgba(239,68,68,0.18); color: #ef4444; }
    .badge.above { background: rgba(34,197,94,0.18); color: #22c55e; }
    .badge.below { background: rgba(239,68,68,0.18); color: #ef4444; }

    /* ── Charts ── */
    .chart-box {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px; height: 380px; position: relative; box-shadow: var(--shadow);
    }

    /* ── Mermaid ── */
    .mermaid { background: var(--mermaid-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }

    /* ── Tabs (top-level navigation) ── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Sub-tabs ── */
    .subtabs-bar { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .subtab-btn {
      padding: 6px 14px; border-radius: 6px; border: none; background: transparent;
      color: var(--text-sec); font-size: 12px; cursor: pointer; transition: all 0.15s;
      border-bottom: 2px solid transparent;
    }
    .subtab-btn:hover { color: var(--text); }
    .subtab-btn.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }
    .subtab-panel { display: none; }
    .subtab-panel.active { display: block; animation: fadeIn 0.3s ease; }

    /* ── Collapsible (animated) ── */
    .collapsible {
      border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px;
      background: var(--bg-sec); overflow: hidden; transition: border-color 0.2s;
    }
    .collapsible:hover { border-color: var(--brand); }
    .collapsible-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--text);
      transition: background 0.2s;
    }
    .collapsible-header:hover { background: var(--hover-bg); }
    .collapsible-body { max-height: 0; overflow: hidden; transition: max-height 0.4s ease, padding 0.4s ease; padding: 0 16px; }
    .collapsible.open .collapsible-body { max-height: 3000px; padding: 12px 16px; }
    .collapsible.open .chevron { transform: rotate(180deg); }
    .chevron { transition: transform 0.2s; font-size: 11px; color: var(--text-sec); }

    /* ── Code blocks ── */
    .code-block {
      background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; overflow-x: auto; font-family: ui-monospace, monospace;
      font-size: 12px; line-height: 1.6; color: #e2e8f0;
    }

    /* ── Statement table ── */
    .statement-table { width: 100%; font-size: 13px; }
    .statement-row td { padding: 6px 12px; border-bottom: 1px solid var(--border); }
    .statement-label { color: var(--text); }
    .statement-value { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .statement-row.subtotal { font-weight: 600; background: var(--brand-dim); }
    .statement-row.subtotal td { border-top: 1px solid var(--border); }
    .statement-row.total { font-weight: 700; background: var(--brand-dim); border-top: 2px solid var(--brand); }
    .statement-value.pos { color: #22c55e; }
    .statement-value.neg { color: #ef4444; }

    /* ── Ratio grid ── */
    .ratio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .ratio-category { background: var(--bg-card); border-radius: 10px; padding: 14px 16px; border: 1px solid var(--border); transition: border-color 0.2s; }
    .ratio-category:hover { border-color: var(--brand); }
    .ratio-category-title { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--brand); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .ratio-items { display: flex; flex-direction: column; gap: 6px; }
    .ratio-item { display: flex; justify-content: space-between; align-items: center; font-size: 13px; cursor: help; position: relative; }
    .ratio-label { color: var(--text-sec); display: inline-flex; align-items: center; gap: 4px; }
    .ratio-info { display: inline-block; font-size: 10px; color: var(--text-sec); opacity: 0.5; cursor: help; }
    .ratio-item:hover .ratio-info { opacity: 1; color: var(--brand); }
    .ratio-value { font-weight: 600; font-variant-numeric: tabular-nums; }

    /* [v1.18] Custom CSS tooltip for ratio items — native title= tooltips
       are unreliable on non-link elements in modern browsers. This ::after
       pseudo-element shows the data-tooltip content on hover. */
    .ratio-item[data-tooltip]:hover::after,
    td[data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-sec);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 400;
      white-space: nowrap;
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: var(--shadow);
      z-index: 1000;
      pointer-events: none;
      white-space: normal;
      width: max-content;
      max-width: 280px;
      text-align: center;
    }
    /* [v1.8] td needs position: relative for the absolutely-positioned
       tooltip ::after to anchor correctly. */
    td[data-tooltip] { position: relative; }
    td[data-tooltip]:hover .ratio-info { opacity: 1; color: var(--brand); }
    .ratio-value.pos { color: #22c55e; }
    .ratio-value.neg { color: #ef4444; }
    .ratio-value.neu { color: var(--text-sec); }

    /* ── Two-column layout ── */
    .two-col-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .two-col-left, .two-col-right { overflow-x: auto; }
    .two-col-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 2px solid var(--brand); }

    /* ── Bug cards ── */
    .bug-card { border-radius: 10px; padding: 16px 20px; border: 1px solid; position: relative; margin-bottom: 12px; }
    .bug-card.critical { border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.04); }
    .bug-card.warning { border-color: rgba(245,158,11,0.4); background: rgba(245,158,11,0.04); }
    .bug-card.minor { border-color: var(--border); background: var(--bg-sec); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-sec); }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .main { grid-column: 1; padding: 16px; }
      .kpi-grid { grid-template-columns: 1fr; }
      .two-col-grid { grid-template-columns: 1fr; }
    }

    /* ── Print ── */
    @media print {
      .sidebar { display: none; }
      .main { grid-column: 1; overflow: visible; height: auto; }
      .tab-panel { display: block !important; }
      .top-bar { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      {% block sidebar %}{% endblock %}
    </aside>
    <main class="main">
      <div class="main-inner">
        <div class="top-bar">
          {% block topbar %}
          <div>
            <h1>{{ title | default('Dashboard') }}</h1>
            {% if subtitle %}<div class="subtitle">{{ subtitle }}</div>{% endif %}
          </div>
          <div class="top-bar-actions">
            <button class="btn-icon" onclick="toggleTheme()" title="Toggle theme">🌓</button>
          </div>
          {% endblock %}
        </div>
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  <script>
    function showTab(btn, panelId) {
      document.querySelectorAll('.nav-item').forEach(b => {
        b.classList.remove('active');
        b.classList.remove('ok');
      });
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      btn.classList.add('ok');
      document.getElementById(panelId).classList.add('active');
    }
    function showSubTab(btn, panelId) {
      var container = btn.closest('.subtabs-container');
      if (!container) return;
      container.querySelectorAll('.subtab-btn').forEach(b => b.classList.remove('active'));
      container.querySelectorAll('.subtab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(panelId).classList.add('active');
    }
    function toggleCollapsible(header) {
      header.parentElement.classList.toggle('open');
    }
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch(e) {}
      if (typeof mermaid !== 'undefined') {
        mermaid.initialize({ startOnLoad: false, theme: next === 'dark' ? 'dark' : 'default' });
      }
    }
    // Load saved theme
    try {
      const saved = localStorage.getItem('theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    } catch(e) {}
    mermaid.initialize({ startOnLoad: true, theme: '{{ theme | default("dark") }}' === 'dark' ? 'dark' : 'default' });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>

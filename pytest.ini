[pytest]
pythonpath = .
testpaths = tests
# [ROUTER FIX] Use importlib import mode to prevent test directory names
# from colliding with real package names (e.g. tests/core/router/ vs core/router.py).
addopts = --import-mode=importlib -m "not slow"
# [v1.2] Suppress tree-sitter-languages deprecation warning (uses old API;
# will go away when tree-sitter-languages updates for tree-sitter 0.26+).
filterwarnings =
    ignore::FutureWarning:tree_sitter
# [v1.3] Markers — "slow" = integration tests that hit real databases + HTTP
# (brapi/investsite). Excluded from default runs via addopts above.
# Run them explicitly: python -m pytest -m slow (or -m "" for everything)
markers =
    slow: integration tests that hit real databases + HTTP (brapi/investsite). ~3 min total.

{# webui/templates/partials/search_results.html — HTMX search results #}
{% if results %}
<ul class="search-list">
  {% for r in results %}
  <li>
    <a href="/webui/company/{{ r.ticker }}" onclick="this.closest('.search-results').innerHTML=''">
      <span class="ticker">{{ r.ticker }}</span>
      {% if r.name %}<span class="name">{{ r.name }}</span>{% endif %}
    </a>
  </li>
  {% endfor %}
</ul>
{% else %}
<div class="no-results">{{ t("company.no_results") }}</div>
{% endif %}

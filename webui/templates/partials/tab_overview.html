{# webui/templates/partials/tab_overview.html — overview tab content #}
<div class="tab-overview">
  <h2>{{ t("company.overview") }} — {{ ticker }}</h2>
  <p>Overview tab — price chart + KPIs will go here.</p>
  {# Price chart with range selector #}
  <div class="chart-section">
    <div class="range-selector">
      <button class="range-btn" hx-get="/api/webui/company/{{ ticker }}/price-chart?range=1M" hx-target="#price-chart-data" hx-swap="innerHTML">1M</button>
      <button class="range-btn" hx-get="/api/webui/company/{{ ticker }}/price-chart?range=6M" hx-target="#price-chart-data" hx-swap="innerHTML">6M</button>
      <button class="range-btn active" hx-get="/api/webui/company/{{ ticker }}/price-chart?range=1A" hx-target="#price-chart-data" hx-swap="innerHTML">1A</button>
      <button class="range-btn" hx-get="/api/webui/company/{{ ticker }}/price-chart?range=5A" hx-target="#price-chart-data" hx-swap="innerHTML">5A</button>
      <button class="range-btn" hx-get="/api/webui/company/{{ ticker }}/price-chart?range=Tudo" hx-target="#price-chart-data" hx-swap="innerHTML">Tudo</button>
    </div>
    <div class="chart-container">
      <canvas id="price-chart" data-chart-type="line"></canvas>
    </div>
    <div id="price-chart-data" style="display:none"
         hx-get="/api/webui/company/{{ ticker }}/price-chart?range=1A"
         hx-trigger="load"
         hx-swap="innerHTML"></div>
  </div>
</div>
